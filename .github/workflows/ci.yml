name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, test, build, 'check:version']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # vitest and jsdom run on Node. The browser tests (in `test`) use the runner's preinstalled Google Chrome, with
      # a chromedriver that WebdriverIO fetches to match it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: bun run ${{ matrix.check }}

  # The compiled package, for installing from GitHub until it is on npm: after every check passes on main, package/
  # (`bun run package`) is committed to the `dist` branch. Commits are added, never replaced, so pinned ones stay.
  dist:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package
        run: bun run package

      - name: Commit to dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin dist >/dev/null; then
            git worktree add ../dist origin/dist
          else
            git worktree add --orphan -b dist ../dist
          fi
          find ../dist -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R package/. ../dist/
          cd ../dist
          git add -A
          if git diff --cached --quiet; then echo 'No change.'; exit 0; fi
          git commit -m "Build of ${GITHUB_SHA}"
          git push origin HEAD:dist
